<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — MoneMoni</title>
    <style>
      /*
       * Self-contained offline page.
       *
       * It is served by the service worker when a navigation cannot reach
       * the network, so it must stay static: no script, no data, nothing
       * that talks to the server. It never contains anything about the
       * user's finances — only a generic notice.
       */
      :root {
        color-scheme: light dark;
        --surface: #ffffff;
        --surface-muted: #f8fafc;
        --border: #e2e8f0;
        --ink: #0f172a;
        --ink-muted: #64748b;
        --brand: #2563eb;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --surface: #0b1220;
          --surface-muted: #0f1729;
          --border: #1f2a3d;
          --ink: #e2e8f0;
          --ink-muted: #94a3b8;
          --brand: #3b82f6;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2.5rem 1rem;
        background-color: var(--surface-muted);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        -webkit-text-size-adjust: 100%;
      }

      .card {
        width: 100%;
        max-width: 22rem;
        padding: 1.25rem;
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        background-color: var(--surface);
        box-shadow: 0 1px 2px rgb(15 23 42 / 0.05);
        text-align: center;
      }

      .mark {
        display: grid;
        place-items: center;
        width: 3rem;
        height: 3rem;
        margin: 0 auto 1rem;
        border-radius: 0.75rem;
        background-color: var(--brand);
        color: #ffffff;
        font-size: 1.125rem;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      p {
        margin: 0.5rem 0 1.25rem;
        color: var(--ink-muted);
        font-size: 0.875rem;
        line-height: 1.5;
      }

      .retry {
        display: inline-block;
        padding: 0.625rem 1rem;
        border-radius: 0.5rem;
        background-color: var(--brand);
        color: #ffffff;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="mark" aria-hidden="true">M</span>
      <h1>You're offline</h1>
      <p>
        MoneMoni could not reach the server. Nothing was changed — try again once
        you are back online.
      </p>
      <a class="retry" href="/">Try again</a>
    </main>
  </body>
</html>
